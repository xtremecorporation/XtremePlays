name: Report a problem
description: Report a problem with X-TREME PLAY'S.
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please do not include passwords, cookies, browser profile folders, or private call recordings.
  - type: input
    id: app-version
    attributes:
      label: App version
      placeholder: 1.3.0
    validations:
      required: true
  - type: input
    id: windows-version
    attributes:
      label: Windows version
      placeholder: Windows 11 24H2 x64
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Include the steps to reproduce the problem and what you expected to happen.
    validations:
      required: true
