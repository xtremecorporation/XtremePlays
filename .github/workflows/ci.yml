name: Windows build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build the Windows app
        shell: pwsh
        run: |
          dotnet restore src/XtremePlays.App/XtremePlays.App.csproj --configfile NuGet.Config -r win-x64
          if ($LASTEXITCODE -ne 0) { throw 'Restore failed.' }
          dotnet build src/XtremePlays.App/XtremePlays.App.csproj --configuration Release --runtime win-x64 --no-restore
          if ($LASTEXITCODE -ne 0) { throw 'Build failed.' }
